<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Password Recovery — SnapFind AI</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="portal-wrap">
    <div class="portal-card">
      <a class="brand" href="/">SNAPFIND<span>AI</span></a>
      <p class="eyebrow">ACCOUNT RECOVERY</p>
      <h1 id="resetHeading">Reset your password</h1>

      <form id="confirmResetForm" class="hidden">
        <p class="muted">Choose a strong new password with at least 10 characters.</p>
        <input id="resetToken" name="token" type="hidden" required>
        <label for="resetNewPw">New password<input id="resetNewPw" name="new_password" type="password" minlength="10" required autocomplete="new-password"></label>
        <button class="btn full" type="submit">Update password</button>
      </form>

      <form id="requestResetForm" class="hidden">
        <p class="muted">Enter your account email. If email delivery is configured, we’ll send a one-time reset link. This page never confirms whether an account exists.</p>
        <label for="reqEmail">Account email<input id="reqEmail" name="email" type="email" required autocomplete="email"></label>
        <button class="btn full" type="submit">Request password reset</button>
      </form>

      <p id="resetMsg" class="muted"></p>
      <p class="switch"><a href="/">← Return to SnapFind AI</a></p>
    </div>
  </main>
  <script src="/reset-password.js"></script>
</body>
</html>
